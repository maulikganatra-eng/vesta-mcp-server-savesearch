# Dependabot — keeps uv.lock, the GitHub Actions pins, and the pre-commit hook
# revs current.
#
# Grouped so a week produces a handful of reviewable PRs rather than one per
# package: one for Actions, one for pre-commit revs, one for Docker base images,
# and dev-vs-production split for uv (production bumps get read properly instead
# of being skimmed alongside a dozen dev-tool patches). Ungrouped Dependabot on a
# repo with a lock file produces a PR per package, which nobody reviews and which
# conflicts with itself on every merge.
#
# The "pre-commit" ecosystem below bumps the `rev:` fields in
# .pre-commit-config.yaml. Without it, a "uv" PR bumping ruff's pyproject.toml
# pin would fail CI's `hooks` job the moment it merges — scripts/check_tool_pins.py
# would (correctly) report the two sides disagree, and a human would have to
# notice and fix it by hand. This does not close that gap on its own — the two
# ecosystems still run as separate, uncoordinated PRs — but it means the
# pre-commit side gets its own bump attempt on the same weekly cadence rather
# than waiting indefinitely for someone to notice check_tool_pins.py's failure.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns: ["*"]
        dependency-type: "development"
      production-dependencies:
        patterns: ["*"]
        dependency-type: "production"
        # Production updates stay separate so a runtime bump gets read properly
        # rather than being skimmed alongside twelve dev-tool patches.
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      pre-commit-hooks:
        patterns: ["*"]
    commit-message:
      prefix: "chore(pre-commit)"

  # Base images and the uv image the Dockerfile copies its binary from. Without
  # this, those were the only pinned versions in the repo with nothing able to
  # update them. Note a python:3.12-slim bump PR will correctly FAIL
  # check-python-version until .python-version is bumped too — that is the
  # intended signal, not a broken PR.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"
