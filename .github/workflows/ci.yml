# =========================================================================
# CI — project-agnostic. Nothing in this file names this project, lists source
# directories, pins a tool version, or states the Python version. Copy it into a
# new repo unchanged.
#
# Four jobs, all independent so a red PR shows every problem at once:
#   hooks   — every pre-commit hook (ruff, format, secrets, hygiene, lock, pins)
#   types   — mypy, strict, blocking
#   tests   — pytest + the coverage gate from pyproject.toml
#   audit   — dependency CVEs, advisory, plus a weekly scheduled run
#
# FOUR DELIBERATE CHOICES, each fixing something that went wrong in our older repos:
#
# 1. `hooks` runs pre-commit rather than installing ruff itself, so
#    .pre-commit-config.yaml is the only place a tool version is written. The older
#    repos pin ruff in both the workflow and the hook config with a comment saying
#    "bump both together"; they have since drifted to 0.15.15 and 0.4.4.
#
# 2. No actions/setup-python step. uv provisions the interpreter and reads
#    .python-version, so the Python version is stated in exactly one file.
#
# 3. No `needs:` chains. In the older repos `type-check` and the PR gate both wait
#    on `lint`, so a formatting nit hides a real failure for a whole cycle.
#
# 4. `types` and `tests` call `scripts/tasks.py` rather than spelling out the
#    mypy/pytest invocation here. That exact command used to be duplicated
#    verbatim across this file, .pre-commit-config.yaml and the Makefile — the
#    same "three places to edit, one gets missed" problem the tool-pin check
#    (scripts/check_tool_pins.py) exists to catch for versions. Deliberately
#    NOT `make type-check`: GNU Make is not on a stock Windows machine's PATH,
#    confirmed empirically, so nothing on this repo's automatic path (a git
#    hook or a CI job) may depend on `make` existing. `uv run` has no such
#    problem — it is one binary with one name on every platform.
# =========================================================================

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — surfaces newly published CVEs
  workflow_dispatch:

# Cancel superseded runs on the same ref so a rapid push sequence does not queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. The default token is broader than any job here needs.
permissions:
  contents: read

jobs:
  # =======================================================================
  # Lint, format, secrets, file hygiene, lock freshness, version pins — one job.
  # =======================================================================
  hooks:
    name: Hooks (ruff, format, secrets, lock, pins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # detect-secrets compares against the committed baseline; full history
          # keeps its diff-based checks meaningful on pull requests.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}
          # Falls back to the most recent cache for this OS on any miss (e.g. a
          # routine Dependabot rev bump), so only the hooks whose rev actually
          # changed rebuild their venv — not every hook's environment from scratch.
          restore-keys: |
            pre-commit-${{ runner.os }}-
      - name: Install project
        # uv reads .python-version and installs the interpreter if it is absent.
        run: uv sync --frozen
      - name: Run pre-commit hooks
        # --hook-stage pre-commit so mypy and pytest do not also run here; they
        # have their own jobs and would otherwise run twice per CI run.
        run: >
          uv run --frozen pre-commit run
          --all-files --show-diff-on-failure --color=always
          --hook-stage pre-commit

  # =======================================================================
  # Type checking — blocking. A new repo has no type debt; keep it that way.
  # =======================================================================
  types:
    name: Type check (mypy, strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: mypy
        # Calls scripts/tasks.py directly, not `make` — see the note on the
        # mypy hook in .pre-commit-config.yaml. [tool.mypy] files in
        # pyproject.toml still means this never needs editing when a
        # directory is added.
        run: uv run --frozen python scripts/tasks.py type-check

  # =======================================================================
  # Tests + coverage gate.
  # =======================================================================
  tests:
    name: Tests (pytest + coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest
        # Calls scripts/tasks.py directly — same reasoning as the mypy step
        # above. The threshold is fail_under in [tool.coverage.report], not
        # repeated here. `contract` and `e2e` need live credentials and are
        # run by hand per the build plan; the task excludes them by marker,
        # keeping CI hermetic.
        run: uv run --frozen python scripts/tasks.py test-cov
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

    # To test a second interpreter, add a matrix and pass it to uv — nothing else
    # in this job changes:
    #
    #   strategy:
    #     fail-fast: false
    #     matrix:
    #       python-version: ["3.11", "3.12"]
    #   ...
    #   - run: uv sync --frozen --python ${{ matrix.python-version }}

  # =======================================================================
  # Dependency CVEs — advisory on purpose.
  #
  # A CVE published in a transitive dependency is not the fault of whichever PR
  # happens to be open, and blocking on it stops unrelated work. The weekly
  # scheduled run is what surfaces these. Treat a failure as a task, not a gate.
  # =======================================================================
  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: pip-audit over the locked dependency set
        # Auditing the lock file rather than the loose ranges in pyproject.toml is
        # the point: it reports what would actually be installed.
        #
        # --no-emit-project omits the `-e .` line. Without it pip-audit tries to
        # BUILD this project rather than audit anything, which fails for reasons
        # that have nothing to do with security.
        #
        # Dev dependencies are included deliberately. They are most of what a
        # service like this depends on, and a CVE in a test or lint tool still runs
        # on developer machines and on CI runners.
        #
        # No --strict: it promotes warnings (such as a dependency with no known
        # vulnerability data) to failures, which for an advisory job produces noise
        # that trains people to ignore the result.
        run: |
          uv export --frozen --no-emit-project --format requirements-txt \
            > requirements.audit.txt
          uvx --python 3.11 pip-audit --requirement requirements.audit.txt
