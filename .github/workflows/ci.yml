# =========================================================================
# CI — project-agnostic. Nothing in this file names this project, lists source
# directories, or pins a tool version. Copy it into a new repo unchanged.
#
# Four jobs:
#   hooks   — runs every pre-commit hook (ruff, format, secrets, hygiene, uv-lock)
#   types   — mypy, strict, blocking
#   tests   — pytest + the coverage gate from pyproject.toml
#   audit   — dependency CVEs, advisory, also on a weekly schedule
#
# WHY `hooks` RUNS pre-commit INSTEAD OF INSTALLING RUFF DIRECTLY.
# It makes .pre-commit-config.yaml the single source of truth for tool versions.
# Our two older repos each pin ruff in both the workflow and the hook config with
# a comment saying "bump both together"; they have since drifted to different
# major versions, so local and CI results disagree. This removes the invariant
# instead of documenting it.
# =========================================================================

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — picks up newly published CVEs
  workflow_dispatch:

# Cancel superseded runs on the same ref so a rapid push sequence does not queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. The default token is read/write on most events; none of these
# jobs write anything, so drop it to read.
permissions:
  contents: read

env:
  # Single place to bump the Python version for every job. Must match
  # .python-version and requires-python in pyproject.toml.
  PYTHON_VERSION: "3.11"

jobs:
  # =======================================================================
  # Lint, format, secrets, file hygiene, lock-file freshness — one job.
  # =======================================================================
  hooks:
    name: Hooks (ruff, format, secrets, lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # detect-secrets compares against the baseline; a shallow clone is fine,
          # but pre-commit's --from-ref usage on PRs benefits from full history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install project (hooks need the venv for uv-lock)
        run: uv sync --frozen
      - name: Run all pre-commit hooks
        # --hook-stage pre-commit so mypy and pytest are NOT run here; they get
        # their own jobs below and would otherwise run twice per CI run.
        run: >
          uv run --frozen pre-commit run
          --all-files --show-diff-on-failure --color=always
          --hook-stage pre-commit

  # =======================================================================
  # Type checking — blocking. A new repo has no type debt; keep it that way.
  # =======================================================================
  types:
    name: Type check (mypy, strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: mypy
        # Targets come from [tool.mypy] files in pyproject.toml, so this command
        # never needs editing when a directory is added.
        run: uv run --frozen mypy

  # =======================================================================
  # Tests + coverage gate.
  #
  # Deliberately NOT `needs: hooks`. Lint and tests are independent signals, and
  # chaining them means a formatting nit hides a real test failure for a full
  # cycle. Both run in parallel; a red PR shows you everything at once.
  # =======================================================================
  tests:
    name: Tests (pytest + coverage gate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry today. Add "3.12" here to test a second interpreter — no other
        # part of this workflow needs to change.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - name: pytest
        # The threshold is fail_under in [tool.coverage.report] — not repeated here.
        # `contract` and `e2e` need live credentials and are run by hand per the
        # incremental build plan; excluding them keeps CI hermetic.
        run: >
          uv run --frozen pytest --cov --cov-report=term-missing
          --cov-report=xml -m "not contract and not e2e"
      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # =======================================================================
  # Dependency CVEs — advisory on purpose.
  #
  # A CVE published in a transitive dependency is not the fault of the PR that
  # happens to be open, and blocking on it stops unrelated work. The weekly
  # scheduled run is what surfaces these; treat a failure as a task, not a gate.
  # =======================================================================
  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: pip-audit over the locked dependency set
        # Auditing the lock file, not the loose ranges in pyproject.toml, is the
        # point — it reports what would actually be installed.
        run: |
          uv export --frozen --no-dev --format requirements-txt > requirements.audit.txt
          uvx pip-audit --requirement requirements.audit.txt --strict
